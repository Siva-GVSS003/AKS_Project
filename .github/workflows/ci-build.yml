name: CI Build Pipeline

on:
  push:
    branches:
      - develop
      - qa
      - staging

env:
  ACR_NAME: tejaacr

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, order-service, payment-service, aksdemo]
        max-parallel: 4   # Run up to 4 jobs in parallel

    steps:
      ################################
      # 1️⃣ Checkout Code
      ################################
      - name: Checkout Code
        uses: actions/checkout@v3

      ################################
      # 2️⃣ Setup Java
      ################################
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      ################################
      # 3️⃣ Cache Maven
      ################################
      - name: Cache Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ matrix.service }}-${{ hashFiles(matrix.service == 'aksdemo' && 'pom.xml' || 'microservices/' + matrix.service + '/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      ################################
      # 4️⃣ Sonar + Build
      ################################
      - name: Sonar + Build
        working-directory: ${{ matrix.service == 'aksdemo' && '.' || 'microservices/' + matrix.service }}
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=${{ matrix.service }} \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      ################################
      # 5️⃣ Login Azure & ACR
      ################################
      - name: Login Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login ACR
        run: az acr login --name $ACR_NAME

      ################################
      # 6️⃣ Docker Build & Push
      ################################
      - name: Docker Build & Push
        working-directory: ${{ matrix.service == 'aksdemo' && '.' || 'microservices/' + matrix.service }}
        run: |
          docker build -t $ACR_NAME.azurecr.io/${{ matrix.service }}:${{ github.sha }} .
          docker push $ACR_NAME.azurecr.io/${{ matrix.service }}:${{ github.sha }}
          docker tag $ACR_NAME.azurecr.io/${{ matrix.service }}:${{ github.sha }} $ACR_NAME.azurecr.io/${{ matrix.service }}:latest
          docker push $ACR_NAME.azurecr.io/${{ matrix.service }}:latest

      ################################
      # 7️⃣ Trivy Scan
      ################################
      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@v0.11.2
        with:
          image-ref: $ACR_NAME.azurecr.io/${{ matrix.service }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
