name: CI Build Pipeline

on:
  push:
    branches:
      - develop
      - qa
      - staging
      - main

env:
  ACR_NAME: tejaacr

jobs:

############################################
# 🧱 USER SERVICE
############################################
  user-service:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 17

    - name: Login Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login ACR
      run: az acr login --name $ACR_NAME

    ################################
    # Build + Sonar
    ################################
    - name: Build & Sonar - User Service
      working-directory: microservices/user-service
      run: |
        mvn clean verify sonar:sonar -DskipTests \
        -Dsonar.projectKey=user-service \
        -Dsonar.host.url=http://20.204.140.194:9000 \
        -Dsonar.login=${{ secrets.SONAR_TOKEN }}

    ################################
    # Docker Build
    ################################
    - name: Build Docker Image - User
      working-directory: microservices/user-service
      run: |
        docker build -t $ACR_NAME.azurecr.io/user-service:${{ github.sha }} .

    ################################
    # Trivy Scan
    ################################
    - name: Trivy Scan - User
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.ACR_NAME }}.azurecr.io/user-service:${{ github.sha }}
        severity: HIGH,CRITICAL
        exit-code: 1

    ################################
    # Push
    ################################
    - name: Push Image - User
      run: |
        docker push $ACR_NAME.azurecr.io/user-service:${{ github.sha }}
        docker tag $ACR_NAME.azurecr.io/user-service:${{ github.sha }} $ACR_NAME.azurecr.io/user-service:latest
        docker push $ACR_NAME.azurecr.io/user-service:latest


