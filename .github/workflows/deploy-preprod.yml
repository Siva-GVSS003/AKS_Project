name: Deploy PreProd Environments

on:
  workflow_dispatch:

env:
  ACR_NAME: tejaacr
  AKS_CLUSTER_NAME: teja-cluster
  AKS_RESOURCE_GROUP: teja-rg

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        env: [dev, qa, staging]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    ###################################
    # LOGIN TO AZURE
    ###################################
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    ###################################
    # INSTALL KUBELOGIN
    ###################################
    - name: Install kubelogin
      run: |
        set -e
        curl -LO https://github.com/Azure/kubelogin/releases/latest/download/kubelogin-linux-amd64.zip
        unzip -o kubelogin-linux-amd64.zip
        sudo install bin/linux_amd64/kubelogin /usr/local/bin/kubelogin
        kubelogin --version

    ###################################
    # CONNECT TO AKS
    ###################################
    - name: Connect to AKS
      run: |
        set -e

        az aks get-credentials \
          --resource-group $AKS_RESOURCE_GROUP \
          --name $AKS_CLUSTER_NAME \
          --overwrite-existing

        kubelogin convert-kubeconfig -l azurecli

    ###################################
    # DEPLOY TO ENV
    ###################################
    - name: Deploy to ${{ matrix.env }}
      run: |
        set -e

        SHA=${GITHUB_SHA}
        NAMESPACE=${{ matrix.env }}

        echo "🚀 Deploying to namespace: $NAMESPACE"
        echo "📦 Image tag: $SHA"

        # Create namespace if not exists
        kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

        # Update Helm dependencies
        for chart in user-service order-service payment-service monolith
        do
          helm dependency update ./helm/$chart
        done

        ###################################
        # SERVICES DEPLOYMENT LOOP
        ###################################
        for service in user-service order-service payment-service springboot-app
        do
          echo "Deploying $service..."

          helm upgrade --install $service ./helm/$service \
            --namespace $NAMESPACE \
            -f ./helm/values-$NAMESPACE.yaml \
            --set image.tag=$SHA
        done

        ###################################
        # VERIFY DEPLOYMENT
        ###################################
        for deploy in user-service order-service payment-service springboot-app
        do
          kubectl rollout status deployment/$deploy -n $NAMESPACE
        done

        helm list -n $NAMESPACE
