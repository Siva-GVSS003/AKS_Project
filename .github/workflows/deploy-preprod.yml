name: Deploy PreProd Environments

on:
  workflow_run:
    workflows: ["CI Build Pipeline"]
    types:
      - completed

env:
  ACR_NAME: tejaacr
  AKS_CLUSTER_NAME: teja-aks-cluster
  AKS_RESOURCE_GROUP: teja-devops-rg

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev,qa,staging]

    steps:
    - uses: actions/checkout@v3

    - name: Login Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Connect AKS
      run: |
        az aks get-credentials \
          --resource-group $AKS_RESOURCE_GROUP \
          --name $AKS_CLUSTER_NAME \
    
    - name: Deploy to ${{ matrix.env }}
      run: |
        set -e   # fail immediately if error
    
        SHA=${{ github.event.workflow_run.head_sha }}
        NAMESPACE=${{ matrix.env }}
    
        echo "🚀 Deploying to namespace: $NAMESPACE"
    
        ###################################
        # Create namespace if not exists
        ###################################
        kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
    
        ###################################
        # HELM DEPENDENCY UPDATE
        ###################################
        helm dependency update ./helm/user-service
        helm dependency update ./helm/order-service
        helm dependency update ./helm/payment-service
        helm dependency update ./helm/monolith
    
        ###################################
        # COMMON HELM FLAGS (BEST PRACTICE)
        ###################################
        #HELM_FLAGS="--install \
        --namespace $NAMESPACE \
        --create-namespace \
        --atomic \
        --timeout 5m"
    
        ###################################
        # DEPLOY USER SERVICE
        ###################################
        helm upgrade user-service ./helm/user-service \
          $HELM_FLAGS \
          -f ./helm/values-$NAMESPACE.yaml \
          --set image.tag=$SHA
    
        ###################################
        # DEPLOY ORDER SERVICE
        ###################################
        helm upgrade order-service ./helm/order-service \
          $HELM_FLAGS \
          -f ./helm/values-$NAMESPACE.yaml \
          --set image.tag=$SHA
    
        ###################################
        # DEPLOY PAYMENT SERVICE
        ###################################
        helm upgrade payment-service ./helm/payment-service \
          $HELM_FLAGS \
          -f ./helm/values-$NAMESPACE.yaml \
          --set image.tag=$SHA
    
        ###################################
        # DEPLOY MONOLITH
        ###################################
        helm upgrade springboot-app ./helm/monolith \
          $HELM_FLAGS \
          -f ./helm/values-$NAMESPACE.yaml \
          --set image.tag=$SHA
    
        ###################################
        # VERIFY DEPLOYMENT (IMPORTANT)
        ###################################
        kubectl rollout status deployment/user-service -n $NAMESPACE
        kubectl rollout status deployment/order-service -n $NAMESPACE
        kubectl rollout status deployment/payment-service -n $NAMESPACE
        kubectl rollout status deployment/springboot-app -n $NAMESPACE
    
        ###################################
        # SHOW HELM RELEASES (DEBUGGING)
        ###################################
        helm list -n $NAMESPACE

