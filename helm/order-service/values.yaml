name: order-service

replicaCount: 1

image:
  repository: tejaacr.azurecr.io/order-service
  tag: latest

container:
  name: order-container
  port: 8080

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  cpu: 60

  resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
