trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  IMAGE_TAG: $(Build.BuildId)
  ACR_NAME: <your-acr-name>.azurecr.io

stages:

# =========================================
# 🚀 STAGE 1: BUILD & PUSH (CI)
# =========================================
- stage: Build
  displayName: Build and Push Images
  jobs:
  - job: BuildPush
    steps:

    - checkout: self

    # Login to ACR
    - task: Docker@2
      displayName: Login to ACR
      inputs:
        command: login
        containerRegistry: acr-connection

    # Build JARs (IMPORTANT)
    - script: |
        cd microservices/user-service && mvn clean package -DskipTests
        cd ../order-service && mvn clean package -DskipTests
        cd ../payment-service && mvn clean package -DskipTests
      displayName: Build JAR files

    # Build & Push USER
    - task: Docker@2
      displayName: Build & Push user-service
      inputs:
        command: buildAndPush
        repository: user-service
        dockerfile: microservices/user-service/Dockerfile
        containerRegistry: acr-connection
        tags: |
          $(IMAGE_TAG)

    # Build & Push ORDER
    - task: Docker@2
      displayName: Build & Push order-service
      inputs:
        command: buildAndPush
        repository: order-service
        dockerfile: microservices/order-service/Dockerfile
        containerRegistry: acr-connection
        tags: |
          $(IMAGE_TAG)

    # Build & Push PAYMENT
    - task: Docker@2
      displayName: Build & Push payment-service
      inputs:
        command: buildAndPush
        repository: payment-service
        dockerfile: microservices/payment-service/Dockerfile
        containerRegistry: acr-connection
        tags: |
          $(IMAGE_TAG)

    # Save IMAGE TAG as artifact
    - script: |
        echo $(IMAGE_TAG) > image-tag.txt
      displayName: Save Image Tag

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: image-tag.txt
        artifact: image-info
        publishLocation: pipeline

