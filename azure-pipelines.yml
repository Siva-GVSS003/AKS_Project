trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  IMAGE_TAG: $(Build.SourceVersion)
  ACR_SERVICE_CONNECTION: acr-connection
  ACR_LOGIN_SERVER: tejaacr.azurecr.io   # <-- replace this

steps:

# =========================
# 1. Checkout code
# =========================
- checkout: self

# =========================
# 2. Build USER SERVICE
# =========================
- task: Maven@3
  displayName: Build user-service
  inputs:
    mavenPomFile: 'microservices/user-service/pom.xml'
    goals: 'clean package'
    publishJUnitResults: false

- task: Docker@2
  displayName: Build & Push user-service
  inputs:
    command: buildAndPush
    repository: user-service
    dockerfile: microservices/user-service/Dockerfile
    containerRegistry: $(ACR_SERVICE_CONNECTION)
    buildContext: microservices/user-service
    tags: |
      $(IMAGE_TAG)

# =========================
# 3. Build ORDER SERVICE
# =========================
- task: Maven@3
  displayName: Build order-service
  inputs:
    mavenPomFile: 'microservices/order-service/pom.xml'
    goals: 'clean package'
    publishJUnitResults: false

- task: Docker@2
  displayName: Build & Push order-service
  inputs:
    command: buildAndPush
    repository: order-service
    dockerfile: microservices/order-service/Dockerfile
    containerRegistry: $(ACR_SERVICE_CONNECTION)
    buildContext: microservices/order-service
    tags: |
      $(IMAGE_TAG)

# =========================
# 4. Build PAYMENT SERVICE
# =========================
- task: Maven@3
  displayName: Build payment-service
  inputs:
    mavenPomFile: 'microservices/payment-service/pom.xml'
    goals: 'clean package'
    publishJUnitResults: false

- task: Docker@2
  displayName: Build & Push payment-service
  inputs:
    command: buildAndPush
    repository: payment-service
    dockerfile: microservices/payment-service/Dockerfile
    containerRegistry: $(ACR_SERVICE_CONNECTION)
    buildContext: microservices/payment-service
    tags: |
      $(IMAGE_TAG)